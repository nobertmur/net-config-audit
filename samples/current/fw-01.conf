#config-version=FGVM64-7.2.5-FW-build1517-230606:opmode=0:vdom=0:user=admin
#conf_file_ver=2222222222222222
#buildno=1517
#global_vdom=1
config system global
    set admin-lockout-threshold 3
    set admintimeout 10
    set hostname "fw-01"
    set pre-login-banner enable
    set strong-crypto enable
end
config system ntp
    set ntpsync enable
end
config system interface
    edit "port1"
        set ip 10.0.2.1 255.255.255.252
        set allowaccess ping https ssh
    next
end
config system admin
    edit "netops"
        set password ENC SH2EXAMPLEENCRYPTEDVALUExxxxxxxxxxxxxxxxxxxxxxxxxxxxxx==
    next
end
